<!DOCTYPE html>
<html lang="es" class="js ready entered fx-bokeh fx-neon">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b151d">
  <title>404, esta mesa no existe · Chris Toloza</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/sacramento-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body { min-height: 100vh; background: linear-gradient(180deg, #0a131b 0%, #0e1b25 45%, #122431 100%); }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .box { width: min(100%, 520px); }
    .big { font-family: var(--font-neon); font-size: clamp(7rem, 26vw, 13rem); line-height: .9; }
    .box h1 { font-size: clamp(2.4rem, 6vw, 3.4rem); color: #f4f8fa; margin-top: 8px; }
    .box p { color: var(--text-dim); margin: 12px 0 26px; }
    .box code { font-family: var(--font-ticket); color: var(--amber-soft); word-break: break-all; }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"><div class="bokeh">
    <i style="--x:8%;--y:12%;--s:150px;--c:255,181,71;--a:.18;--t:21s;--dl:-4s"></i>
    <i style="--x:70%;--y:20%;--s:110px;--c:255,111,142;--a:.15;--t:19s;--dl:-8s"></i>
    <i style="--x:40%;--y:60%;--s:90px;--c:142,197,230;--a:.12;--t:25s;--dl:-2s"></i>
  </div></div>
  <main>
    <div class="box">
      <div class="big neon">404</div>
      <h1>Esta mesa no existe</h1>
      <p>No encontré <code id="p"></code> en la carta. Puede que el enlace esté mal escrito o que la página ya no esté.</p>
      <a class="btn" href="/">Volver al inicio</a>
    </div>
  </main>
  <script>document.getElementById("p").textContent = location.pathname</script>
</body>
</html>
